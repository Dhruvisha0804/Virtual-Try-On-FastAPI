<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>AI Virtual Try-On</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="../static/account.css">
</head>
<body>
  <div class="container">
    <h1 class="title">Account Setup</h1>
    <p class="subtitle">Enter your details to continue using Virtual Try-On.</p>

    <div class="form-card">
      <form method="POST" action="/account/login">
        <div class="form-group">
          <label for="user_id">User ID</label>
          <input type="text" id="user_id" name="user_id" placeholder="Enter your ID" required>
        </div>

        <div class="form-group">
          <label for="username">Username</label>
          <input type="text" id="username" name="username" placeholder="Enter your name" required>
        </div>

        <div class="form-actions">
          <button type="submit" class="btn-primary">Login</button>
          <a href="/" class="btn-secondary">Back</a>
        </div>
      </form>
    </div>
  </div>
</body>
</html>
